<svg xmlns="http://www.w3.org/2000/svg" width="840" height="132" viewBox="0 0 840 132" role="img" aria-label="Visitar site pessoal de Fábio Vieira Gambarini em vieirafabiog.github.io">
  <defs>
    <pattern id="dot-matrix" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="838" height="130" rx="7.5" />
    </clipPath>
  </defs>

  <!-- Outer card with dot-matrix gutters -->
  <rect x="0.5" y="0.5" width="839" height="131" rx="8" fill="#0e0e0e" stroke="#262626" stroke-width="1" />
  <g clip-path="url(#card-clip)">
    <rect x="1" y="1" width="838" height="130" fill="url(#dot-matrix)" />

    <!-- Central architectural page-shell rail (solid bg + dashed side borders) -->
    <rect x="40" y="1" width="760" height="130" fill="#0e0e0e" />
    <line x1="40" y1="1" x2="40" y2="131" stroke="#262626" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="800" y1="1" x2="800" y2="131" stroke="#262626" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Inner hairline grid-frame -->
  <rect x="58" y="16" width="504" height="100" fill="#0e0e0e" />
  <rect x="562" y="16" width="220" height="100" fill="#141414" />
  <rect x="58" y="16" width="724" height="100" fill="none" stroke="#262626" stroke-width="1" />
  <line x1="562" y1="16" x2="562" y2="116" stroke="#262626" stroke-width="1" />

  <!-- Architectural corner-node intersection squares -->
  <rect x="54.5" y="12.5" width="7" height="7" fill="#0e0e0e" stroke="#363636" stroke-width="1" />
  <rect x="558.5" y="12.5" width="7" height="7" fill="#0e0e0e" stroke="#363636" stroke-width="1" />
  <rect x="778.5" y="12.5" width="7" height="7" fill="#0e0e0e" stroke="#363636" stroke-width="1" />
  <rect x="54.5" y="112.5" width="7" height="7" fill="#0e0e0e" stroke="#363636" stroke-width="1" />
  <rect x="558.5" y="112.5" width="7" height="7" fill="#0e0e0e" stroke="#363636" stroke-width="1" />
  <rect x="778.5" y="112.5" width="7" height="7" fill="#0e0e0e" stroke="#363636" stroke-width="1" />

  <!-- Signature dashed orange node-badge with edge squares -->
  <rect x="82" y="29" width="136" height="22" rx="4" fill="#f6821f" fill-opacity="0.08" stroke="#f6821f" stroke-width="1" stroke-dasharray="3 3" />
  <rect x="79.5" y="37.5" width="5" height="5" fill="#0e0e0e" stroke="#f6821f" stroke-width="1" />
  <rect x="215.5" y="37.5" width="5" height="5" fill="#0e0e0e" stroke="#f6821f" stroke-width="1" />
  <text
    x="150"
    y="43.5"
    text-anchor="middle"
    fill="#fed7aa"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="10.5"
    font-weight="600"
    letter-spacing="0.6"
  >SITE · PORTFÓLIO</text>

  <!-- Main domain title -->
  <text
    x="82"
    y="78"
    fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="21"
    font-weight="600"
    letter-spacing="-0.5"
  >vieirafabiog.github.io</text>

  <!-- Subtitle -->
  <text
    x="82"
    y="99"
    fill="#a1a1aa"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="12.5"
    font-weight="400"
  >Projetos em destaque, experiência, stack e certificados</text>

  <!-- Right CTA cell -->
  <rect x="600" y="38" width="144" height="38" rx="19" fill="#f6821f" />
  <text
    x="672"
    y="61.5"
    text-anchor="middle"
    fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="600"
  >Acessar site  ↗</text>

</svg>
